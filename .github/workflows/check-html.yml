name: check-html-sync

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify HTML matches Markdown and required elements
        run: |
          set +e
          python tools/build_html.py --check --audit --stats > /tmp/out.txt 2>&1
          code=$?
          bytes=$(wc -c < /tmp/out.txt)
          echo "exit=$code bytes=$bytes python=$(python -V 2>&1)"
          cat /tmp/out.txt
          fails=$(grep -aE "FAIL:|未登记的代码语言|文首引用块|代码围栏未配对|S6 |S7 " /tmp/out.txt | head -4 | tr '\n' '|' | cut -c1-600)
          echo "::error title=exit $code::$fails"
          exit $code

      - name: Verify landing page matches README index
        run: python tools/build_index.py --check
